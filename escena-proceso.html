<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <title>Escena proceso</title>
</head>

<body>
  <a-scene physics="gravity: -9.8">

    <!-- Cargar modelos -->
    <a-assets>
      <a-asset-item id="fluorescent" src="./assets/models/weathered_fluorescent_light_-_4096px2.glb"></a-asset-item>
      <a-assets-item id="recreativa1" src="./assets/models/6jynqxn2i2-11/skydiver.3ds"></a-assets-item>
    </a-assets>

    <!-- Luces -->
    <a-light type="point" intensity="0.1" distance="6" color="#ffffff" position="2 2.5 0">
    </a-light>
    <a-light type="point" intensity="0.1" distance="6" color="#ffffff" position="-2 2.5 0">
    </a-light>


    <!-- Piso -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10"
      material="src: ./assets/textures/wood_floor.jpg;repeat:3 3" static-body></a-plane>

    <!-- Techo -->
    <a-plane position="0 2.5 0" rotation="90 0 0" width="10" height="10"
      material="shader:flat;src: ./assets/textures/Textura techo.jpg;repeat:10 10;color: #222" static-body></a-plane>

    <!-- Paredes (2.5 m altura) -->
    <a-box position="0 1.25 -5" material="src: ./assets/textures/painted_wall.jpg;repeat:7 2; color: #505" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
    <a-box position="0 1.25 5" material="src: ./assets/textures/painted_wall.jpg;repeat:7 2; color: #505" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
    <a-box position="5 1.25 0" material="src: ./assets/textures/painted_wall.jpg;repeat:7 2; color: #505" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>
    <a-box position="-5 1.25 0" material="src: ./assets/textures/painted_wall.jpg;repeat:7 2; color: #505" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>

    <!-- Recreativas -->
    <a-entity  position="0 1.25 -5" scale="1 1 1" gltf-model="#recreativa1"></a-entity>
    

    <!-- Jugador -->
    <a-entity id="player" position="0 0 0" movement-controls kinematic-body="radius: 0.3; height: 1.6">
      <a-camera position="0 1.6 0"></a-camera>
    </a-entity>

    <!-- Lámpara fluorescente -->
    <a-entity position="2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>
    <a-entity position="-2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>

  </a-scene>

  </script>
</body>

</html>
