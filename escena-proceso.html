<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
<title>Escena proceso</title>
</head>

<body>
    <a-scene physics="gravity: -9.8">

        <!-- Cargar modelos -->
        <a-assets>
            <a-asset-item id="fluorescent"
                src="./assets/models/weathered_fluorescent_light_-_4096px2.glb"
                ></a-asset-item>
        </a-assets>

        <!-- Luces -->
        
        <a-light type="point"
              intensity="1.6"
              distance="8"
              color="#ffffff"
              position="0 2.35 0.2">
    </a-light>
    

        <!-- Piso -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" material="src: ./assets/textures/wood_floor.jpg;repeat:3 3" static-body></a-plane>

        <!-- Techo -->
        <a-plane position="0 2.5 0" rotation="90 0 0" width="10" height="10" material="shader:flat;src: ./assets/textures/wood_floor.jpg;repeat:3 3;"  static-body></a-plane>

        <!-- Paredes (2.5 m altura) -->
        <a-box position="0 1.25 -5" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
        <a-box position="0 1.25 5" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
        <a-box position="5 1.25 0" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>
        <a-box position="-5 1.25 0" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>

        <!-- Objetos -->
        <a-sphere position="4.2 1 -4.2" radius="1" color="#E53935" static-body></a-sphere>
        <a-box position="-3.5 1 -3.5" depth="2" height="2.5" width="2" color="#3F51B5" static-body></a-box>
        <a-cylinder position="4.2 1 4.2" radius="1" height="2" color="#4CAF50" static-body></a-cylinder>
        <a-cone position="-4.2 1 4.2" radius-bottom="1.2" height="2.5" color="#FF9800" static-body></a-cone>

        <!-- Jugador -->
        <a-entity id="player" position="0 0 0" movement-controls
            kinematic-body="radius: 0.3; height: 1.6">
            <a-camera position="0 1.6 0"></a-camera>
        </a-entity>

        <!-- Lámpara fluorescente -->
        <a-entity position="0 2.50 0"
                  rotation="0 0 0"
                  scale="2 1 3"
                  gltf-model="#fluorescent"
                  fluor-lighting
                  id="Fluorescent">
                </a-entity>
        

   
 

    </a-scene>

    <script>
AFRAME.registerComponent("fluor-lighting", {
  init() {
    this.el.addEventListener("model-loaded", () => {
      const model = this.el.getObject3D("model"); // Aquí guardamos el mesh GLTF
      if (!model) return;

      model.traverse(obj => {
        if (obj.isMesh) {
          if (obj.name.toLowerCase().includes("tube") ||
              obj.name.toLowerCase().includes("light") ||
              obj.name.toLowerCase().includes("bulb")) {

            // Manejo de materiales simples y múltiples
            if (Array.isArray(obj.material)) {
              obj.material.forEach(mat => {
                mat.emissive = new THREE.Color(1, 1, 1);
                mat.emissiveIntensity = 3.5;
                mat.needsUpdate = true;
              });
            } else {
              obj.material.emissive = new THREE.Color(1, 1, 1);
              obj.material.emissiveIntensity = 3.5;
              obj.material.needsUpdate = true;
            }
          }
        }
      });
    });
  }
});
</script>
</body>
</html>
