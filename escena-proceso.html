<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8">

      <!-- Luces -->
      <a-entity light="type: ambient; intensity: 0.4"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-2 4 3"></a-entity>
      <a-entity light="type: point; intensity: 0.4; distance: 15" position="0 2 0"></a-entity>

      <!-- Piso -->
      <a-plane position="0 0 0"
               rotation="-90 0 0"
               width="10" height="10"
               color="#777"
               static-body>
      </a-plane>

      <!-- Techo -->
      <a-plane position="0 2.5 0"
               rotation="90 0 0"
               width="10" height="10"
               color="#777"
               static-body>
      </a-plane>

      <!-- Paredes (2.5 m altura) -->
      <a-box position="0 1.25 -5" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
      <a-box position="0 1.25 5" width="10" height="2.5" depth="0.1" color="#ccc" static-body></a-box>
      <a-box position="5 1.25 0" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>
      <a-box position="-5 1.25 0" width="0.1" height="2.5" depth="10" color="#ccc" static-body></a-box>

      <!-- Objetos esquina -->
      <a-sphere position="4.2 1 -4.2" radius="1" color="#E53935" static-body></a-sphere>
      <a-box position="-4.2 1 -4.2" depth="2" height="2" width="2" color="#3F51B5" static-body></a-box>
      <a-cylinder position="4.2 1 4.2" radius="1" height="2" color="#4CAF50" static-body></a-cylinder>
      <a-cone position="-4.2 1 4.2" radius-bottom="1.2" height="2.5" color="#FF9800" static-body></a-cone>

      <!-- JUGADOR: cuerpo físico y cámara -->
      <a-entity id="player"
                position="0 0 0"
                movement-controls
                kinematic-body="radius: 0.3; height: 1.6">

        <!-- Cámara a altura de ojos (1.6 m) -->
        <a-camera position="0 1.6 0"></a-camera>

      </a-entity>

    </a-scene>
  </body>
</html>
