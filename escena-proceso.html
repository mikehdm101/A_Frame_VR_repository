<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-physics-extras@v6.1.1/dist/aframe-physics-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-gltf-part-component@v6.1.1/dist/aframe-gltf-part-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-animation-component@v6.1.1/dist/aframe-animation-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-event-set-component@v6.1.1/dist/aframe-event-set-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-state-component@v6.1.1/dist/aframe-state-component.min.js"></script>
  <title>Escena proceso</title>
</head>

<body>
  <a-scene physics="gravity: -9.8">

    <!-- Player -->

    <a-entity id="rig" position="0 1.6 0" movement-controls="speed: 0.15">
    </a-entity>

    <!-- Luces -->
    <a-light type="point" intensity="0.5" distance="6" color="#ffffff" position="2 2.5 0">
    </a-light>
    <a-light type="point" intensity="0.5" distance="6" color="#ffffff" position="-2 2.5 0">
    </a-light>
    
    <!-- Cargar modelos -->
    <a-assets>
      <a-asset-item id="fluorescent" src="./assets/models/weathered_fluorescent_light_-_4096px2.glb"></a-asset-item>
      <a-asset-item id="cristaldoor" src="./assets/models/glass_door_247/scene.gltf"></a-asset-item>
      <a-assets-item id="recreativa1" src="./assets/models/arcade_retro/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa2" src="./assets/models/arcade_the_real_ghostbusters/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa3" src="./assets/models/claw_machine/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa4" src="./assets/models/dance_dance_revolution/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa5" src="./assets/models/pacman_arcade__animation/scene.gltf"></a-assets-item>
      <a-assets-item id="bb8" src="./assets/models/bb8_animated.glb"></a-assets-item>
      <a-asset-item id="ATAT" src="./assets/models/imperial_at-at_walker_old_version_-_star_wars.glb"></a-asset-item>
    </a-assets>

    <!-- Piso -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10"
      material="src: ./assets/textures/wood_floor.jpg;repeat:3 3" static-body></a-plane>

    <!-- Techo -->
    <a-plane position="0 2.5 0" rotation="90 0 0" width="10" height="10"
      material="shader:flat;src: ./assets/textures/Textura techo.jpg;repeat:10 10;color: #222" static-body></a-plane>

    <!-- Cielo -->
    <a-sky src="./assets/360/fondo final de chatgpt.png" rotation="0 180 0"></a-sky>

    <!-- Paredes -->
    <a-box position="0 1.25 -5" material="src: ./assets/textures/painted_wall.jpg;repeat:3 1; color: #A1001A" width="10"
      height="2.5" depth="0.1" color="#A1001A" static-body></a-box>
    <a-box position="0 1.25 5" material="src: ./assets/textures/painted_wall.jpg; repeat:1 1" width="10" height="2.5"
      depth="0.1" color="#A1001A" static-body></a-box>
    <a-box position="5 1.25 0" width="0.1" height="2" depth="2" static-body visible="false"></a-box>
    <a-box position="5 1.25 3" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #A1001A" width="0.1"
      height="2.5" depth="4" color="#A1001A" static-body></a-box>
    <a-box position="5 2.5 0" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #A1001A" width="0.1"
      height="0.4" depth="4" color="#A1001A" static-body></a-box>
    <a-box position="5 1.25 -3" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #A1001A" width="0.1"
      height="2.5" depth="4" color="#A1001A" static-body></a-box>
    <a-box position="-5 1.25 0" material="src: ./assets/textures/painted_wall.jpg;repeat:3 1; color: #A1001A" width="0.1"
      height="2.5" depth="10" color="#A1001A" static-body></a-box>

    <!-- Recreativas -->
    <a-entity position="5 0 0.5" scale="0.012 0.0113 0.01" rotation="0 -90 0" gltf-model="#cristaldoor"></a-entity>
    <a-entity position="5 0 -0.5" scale="0.012 0.0113 0.01" rotation="0 90 0" gltf-model="#cristaldoor"></a-entity>
    <a-entity position="-1.2 0 -4.5" scale="15 15 15" gltf-model="#recreativa1"></a-entity>
    <a-entity position="1 0 -4.5" scale="0.07 0.07 0.07" rotation="0 180 0" gltf-model="#recreativa2"></a-entity>
    <a-entity position="-2.5 0 -4.5" scale="1 1 1" gltf-model="#recreativa3"></a-entity>
    <a-entity position="-2.2 0 -3.7" scale="0.35 0.35 0.35" gltf-model="#recreativa4"></a-entity>
    <a-entity position="0 0 0" scale="1 1 1" gltf-modesl="#recreativa5"></a-entity>
    <a-entity position="3 0 3 " scale="1 1 1" rotation="0 160 0" gltf-model="#bb8" animation-mixer></a-entity>
    <a-entity position="2 0 5 " scale="0.05 0.05 0.05" rotation="0 180 0" gltf-model="#ATAT" animation-mixer></a-entity>

    
    <!-- Lámpara fluorescente -->
    <a-entity position="2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>
    <a-entity position="-2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>
  </a-scene>
</body>

</html>
