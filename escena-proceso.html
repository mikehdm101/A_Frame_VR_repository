<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script>
    AFRAME.registerComponent("boton-interactivo", {
      init: function () {
        const boton = this.el;
        const muñeco = document.querySelector("#muñeco");

        boton.addEventListener("click", () => {
          console.log("BOTÓN ACTIVADO");

          if (boton.isPressed) return;
          boton.isPressed = true;

          // Animación botón (hundirse)
          boton.setAttribute("animation__press", {
            property: "scale",
            to: "0.8 0.8 0.8",
            dur: 100
          });

          // Cambiar pose
          muñeco.setAttribute("material", "src: #posePatada; transparent: true");

          // Animación patada
          muñeco.setAttribute("animation__kick", {
            property: "position",
            to: "0 0.5 3.6",
            dur: 250,
            easing: "easeOutQuad"
          });

          // Volver muñeco
          setTimeout(() => {
            muñeco.setAttribute("material", "src: #poseQuieto; transparent: true");

            muñeco.setAttribute("animation__back", {
              property: "position",
              to: "0 0.5 3.9",
              dur: 250,
              easing: "easeOutQuad"
            });
          }, 350);

          // Volver botón
          setTimeout(() => {
            boton.setAttribute("animation__release", {
              property: "scale",
              to: "1 1 1",
              dur: 150
            });
            boton.isPressed = false;
          }, 600);
        });
      }
    });
  </script>
  <title>Escena proceso</title>
</head>

<body>
  <a-scene physics="gravity: -9.8">

    <!-- Player -->

    <a-entity id="rig" position="0 1.6 0" movement-controls="speed: 0.15">
      <a-entity camera look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 15">

        <a-cursor raycaster="objects: .interactable" material="color: red; shader: flat">
        </a-cursor>

      </a-entity>
    </a-entity>

    <!-- boton -->
    <a-sphere id="boton" class="interactable" boton-interactivo position="0 1.3 2" radius="0.1" color="#ff4145">
    </a-sphere>

    <!-- Cargar modelos -->
    <a-assets>
      <a-asset-item id="fluorescent" src="./assets/models/weathered_fluorescent_light_-_4096px2.glb"></a-asset-item>
      <a-asset-item id="cristaldoor" src="./assets/models/glass_door_247/scene.gltf"></a-asset-item>
      <a-assets-item id="recreativa1" src="./assets/models/arcade_retro/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa2" src="./assets/models/arcade_the_real_ghostbusters/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa3" src="./assets/models/claw_machine/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa4" src="./assets/models/dance_dance_revolution/scene.gltf"></a-assets-item>
      <a-assets-item id="recreativa5" src="./assets/models/pacman_arcade__animation/scene.gltf"></a-assets-item>
      <a-assets-item id="bb8" src="./assets/models/bb8_animated.glb"></a-assets-item>
      <img id="poseQuieto" src="./assets/textures/Posequiet.png">
      <img id="posePatada" src="./assets/textures/posepegando.png">
      <img id="posequieto2" src="./assets/textures/posequieto2.png">
    </a-assets>

    <!-- Luces -->
    <a-light type="point" intensity="0.5" distance="6" color="#ffffff" position="2 2.5 0">
    </a-light>
    <a-light type="point" intensity="0.5" distance="6" color="#ffffff" position="-2 2.5 0">
    </a-light>

    <!-- Piso -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10"
      material="src: ./assets/textures/wood_floor.jpg;repeat:3 3" static-body></a-plane>

    <!-- Techo -->
    <a-plane position="0 2.5 0" rotation="90 0 0" width="10" height="10"
      material="shader:flat;src: ./assets/textures/Textura techo.jpg;repeat:10 10;color: #222" static-body></a-plane>

    <!-- Escena -->
    <a-box static-body position="0 1.25 4" rotation="0 180 0"
      material="src: ./assets/textures/first-scenary.PNG;repeat:1 1 ;color: rgba(255, 255, 255, 0); transparent: true;"
      width="10" height="2.5" depth="0.1" static-body></a-box>

    <!-- Cielo -->
    <a-sky src="./assets/360/fondo final de chatgpt.png" rotation="0 180 0"></a-sky>

    <!-- Paredes -->
    <a-box position="0 1.25 -5" material="src: ./assets/textures/painted_wall.jpg;repeat:3 1; color: #505" width="10"
      height="2.5" depth="0.1" color="#ccc" static-body></a-box>
    <a-box position="0 1.25 5" material="src: ./assets/textures/second-scenary.PNG; repeat:1 1" width="10" height="2.5"
      depth="0.1" color="#ccc" static-body></a-box>
    <a-box position="5 1.25 0" width="0.1" height="2" depth="2" static-body visible="false"></a-box>
    <a-box position="5 1.25 3" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #505" width="0.1"
      height="2.5" depth="4" color="#ccc" static-body></a-box>
    <a-box position="5 2.5 0" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #505" width="0.1"
      height="0.4" depth="4" color="#ccc" static-body></a-box>
    <a-box position="5 1.25 -3" material="src: ./assets/textures/painted_wall.jpg;repeat:1 1; color: #505" width="0.1"
      height="2.5" depth="4" color="#ccc" static-body></a-box>
    <a-box position="-5 1.25 0" material="src: ./assets/textures/painted_wall.jpg;repeat:3 1; color: #505" width="0.1"
      height="2.5" depth="10" color="#ccc" static-body></a-box>

    <!-- Recreativas -->
    <a-entity position="5 0 0.5" scale="0.012 0.0113 0.01" rotation="0 -90 0" gltf-model="#cristaldoor"></a-entity>
    <a-entity position="5 0 -0.5" scale="0.012 0.0113 0.01" rotation="0 90 0" gltf-model="#cristaldoor"></a-entity>
    <a-entity position="-1.2 0 -4.5" scale="15 15 15" gltf-model="#recreativa1"></a-entity>
    <a-entity position="1 0 -4.5" scale="0.07 0.07 0.07" rotation="0 180 0" gltf-model="#recreativa2"></a-entity>
    <a-entity position="-2.5 0 -4.5" scale="1 1 1" gltf-model="#recreativa3"></a-entity>
    <a-entity position="-2.2 0 -3.7" scale="0.35 0.35 0.35" gltf-model="#recreativa4"></a-entity>
    <a-entity position="0 0 0" scale="1 1 1" gltf-modesl="#recreativa5"></a-entity>
    <!--<a-entity position="3 0 3 " scale="1 1 1" rotation="0 160 0" gltf-model="#bb8"></a-entity> -->

    <!-- Jugador -->


    <!--Muñeco-->
    <a-plane id="muñeco" position="0 0.5 3.9" rotation="0 180 0" width="0.4" height="0.5"
      material="src: #poseQuieto; transparent: true">
    </a-plane>
    <a-plane position="-1 0.5 3.90" rotation="0 180 0"
      material="src: #posequieto2; repeat:1 1; color: rgba(255, 255, 255, 0.3); transparent: true; " width="0.4"
      height="0.5" scale="-1 1 1" static-body></a-plane>

    <!-- Lámpara fluorescente -->
    <a-entity position="2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>
    <a-entity position="-2 2.50 0" rotation="0 90 0" scale="1 1 1" gltf-model="#fluorescent" fluor-lighting
      id="Fluorescent">
    </a-entity>
  </a-scene>
</body>

</html>
